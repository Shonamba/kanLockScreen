name: Build Kannada Lock Clock APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate entire project
        run: |
          # ========== ROOT FILES ==========
          cat > settings.gradle << 'SETTINGSEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = "KannadaLockClock"
          include ':app'
          SETTINGSEOF

          cat > build.gradle << 'ROOTEOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          ROOTEOF

          cat > gradle.properties << 'GPEOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          GPEOF

          # ========== APP BUILD ==========
          mkdir -p app
          cat > app/build.gradle << 'APPEOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.kannada.lockclock'
              compileSdk 34
              defaultConfig {
                  applicationId "com.kannada.lockclock"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug { minifyEnabled false }
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint { abortOnError false }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          APPEOF

          # ========== MANIFEST ==========
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'MANIFESTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.kannada.lockclock">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <application
                  android:allowBackup="true"
                  android:label="ಕನ್ನಡ ಗಡಿಯಾರ"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".LockScreenOverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse"/>
                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true"
                      android:enabled="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>
                  </receiver>
                  <receiver
                      android:name=".ScreenReceiver"
                      android:exported="false"
                      android:enabled="true"/>
              </application>
          </manifest>
          MANIFESTEOF

          # ========== JAVA SOURCE FILES ==========
          mkdir -p app/src/main/java/com/kannada/lockclock

          # --- KannadaTimeUtil.java ---
          cat > app/src/main/java/com/kannada/lockclock/KannadaTimeUtil.java << 'UTILEOF'
          package com.kannada.lockclock;
          import java.util.Calendar;
          public class KannadaTimeUtil {
              private static final String[] KANNADA_DIGITS = {"೦","೧","೨","೩","೪","೫","೬","೭","೮","೯"};
              private static final String[] KANNADA_DAYS = {"","ಭಾನುವಾರ","ಸೋಮವಾರ","ಮಂಗಳವಾರ","ಬುಧವಾರ","ಗುರುವಾರ","ಶುಕ್ರವಾರ","ಶನಿವಾರ"};
              private static final String[] KANNADA_MONTHS = {"ಜನವರಿ","ಫೆಬ್ರವರಿ","ಮಾರ್ಚ್","ಏಪ್ರಿಲ್","ಮೇ","ಜೂನ್","ಜುಲೈ","ಆಗಸ್ಟ್","ಸೆಪ್ಟೆಂಬರ್","ಅಕ್ಟೋಬರ್","ನವೆಂಬರ್","ಡಿಸೆಂಬರ್"};

              public static String toKannada(int number) {
                  StringBuilder sb = new StringBuilder();
                  for (char c : String.valueOf(number).toCharArray()) {
                      int d = c - '0';
                      sb.append((d >= 0 && d <= 9) ? KANNADA_DIGITS[d] : c);
                  }
                  return sb.toString();
              }
              public static String pad(int n) {
                  return (n < 10) ? "೦" + toKannada(n) : toKannada(n);
              }
              public static String getPeriod(int h) {
                  if (h >= 4 && h < 12) return "ಬೆಳಿಗ್ಗೆ";
                  if (h >= 12 && h < 16) return "ಮಧ್ಯಾಹ್ನ";
                  if (h >= 16 && h < 19) return "ಸಂಜೆ";
                  return "ರಾತ್ರಿ";
              }
              public static String getTime(Calendar c) {
                  int h24 = c.get(Calendar.HOUR_OF_DAY);
                  int h12 = c.get(Calendar.HOUR); if (h12==0) h12=12;
                  return getPeriod(h24) + " " + toKannada(h12) + ":" + pad(c.get(Calendar.MINUTE)) + ":" + pad(c.get(Calendar.SECOND));
              }
              public static String getTimeLarge(Calendar c) {
                  int h24 = c.get(Calendar.HOUR_OF_DAY);
                  int h12 = c.get(Calendar.HOUR); if (h12==0) h12=12;
                  return toKannada(h12) + ":" + pad(c.get(Calendar.MINUTE));
              }
              public static String getDate(Calendar c) {
                  return toKannada(c.get(Calendar.DAY_OF_MONTH)) + " " + KANNADA_MONTHS[c.get(Calendar.MONTH)] + " " + toKannada(c.get(Calendar.YEAR));
              }
              public static String getDay(Calendar c) {
                  return KANNADA_DAYS[c.get(Calendar.DAY_OF_WEEK)];
              }
              public static String getPeriodOnly(Calendar c) {
                  return getPeriod(c.get(Calendar.HOUR_OF_DAY));
              }
          }
          UTILEOF

          # --- ScreenReceiver.java ---
          cat > app/src/main/java/com/kannada/lockclock/ScreenReceiver.java << 'SCREENEOF'
          package com.kannada.lockclock;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          public class ScreenReceiver extends BroadcastReceiver {
              private ScreenStateListener listener;
              public interface ScreenStateListener {
                  void onScreenOn();
                  void onScreenOff();
              }
              public void setListener(ScreenStateListener l) { this.listener = l; }
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null || intent.getAction() == null) return;
                  if (Intent.ACTION_SCREEN_ON.equals(intent.getAction()) && listener != null) listener.onScreenOn();
                  if (Intent.ACTION_SCREEN_OFF.equals(intent.getAction()) && listener != null) listener.onScreenOff();
              }
          }
          SCREENEOF

          # --- BootReceiver.java ---
          cat > app/src/main/java/com/kannada/lockclock/BootReceiver.java << 'BOOTEOF'
          package com.kannada.lockclock;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      Intent si = new Intent(context, LockScreenOverlayService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(si);
                      } else {
                          context.startService(si);
                      }
                  }
              }
          }
          BOOTEOF

          # --- LockScreenOverlayService.java ---
          cat > app/src/main/java/com/kannada/lockclock/LockScreenOverlayService.java << 'SERVICEEOF'
          package com.kannada.lockclock;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.LayoutInflater;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;

          import java.util.Calendar;

          public class LockScreenOverlayService extends Service implements ScreenReceiver.ScreenStateListener {

              private static final String CHANNEL_ID = "kannada_clock_channel";
              private WindowManager windowManager;
              private View overlayView;
              private Handler handler;
              private Runnable ticker;
              private ScreenReceiver screenReceiver;
              private boolean overlayVisible = false;

              private TextView overlayTime, overlayPeriod, overlayDate, overlayDay;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
                  Notification notification = null;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      notification = new Notification.Builder(this, CHANNEL_ID)
                          .setContentTitle("ಕನ್ನಡ ಗಡಿಯಾರ")
                          .setContentText("ಲಾಕ್ ಸ್ಕ್ರೀನ್ ಗಡಿಯಾರ ಚಾಲನೆಯಲ್ಲಿದೆ")
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .build();
                  }
                  startForeground(1, notification);

                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  handler = new Handler(Looper.getMainLooper());

                  screenReceiver = new ScreenReceiver();
                  screenReceiver.setListener(this);
                  IntentFilter filter = new IntentFilter();
                  filter.addAction(Intent.ACTION_SCREEN_ON);
                  filter.addAction(Intent.ACTION_SCREEN_OFF);
                  registerReceiver(screenReceiver, filter);

                  // Show overlay immediately
                  showOverlay();
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID, "ಕನ್ನಡ ಗಡಿಯಾರ ಸೇವೆ", NotificationManager.IMPORTANCE_LOW);
                      channel.setDescription("ಲಾಕ್ ಸ್ಕ್ರೀನ್ ಗಡಿಯಾರ");
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(channel);
                  }
              }

              private void showOverlay() {
                  if (overlayVisible) return;

                  int layoutFlag;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
